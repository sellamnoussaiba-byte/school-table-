<script>
'use strict';
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const LS='tt-platform-v1';
let S=null;
const UI={page:'dash',cls:'',tch:'',room:'',sel:null,hints:null,msg:null,drawer:false,pst:'',tab:0,cand:[],gen:null,opt:{n:4,ms:2500},exp:{scope:'one',id:''},modal:null};
let DL=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,8);
const by=(a,id)=>a.find(x=>x.id===id);
const nm=(a,id,d='—')=>{const x=by(a,id);return x?x.name:d};
const tick=()=>new Promise(r=>setTimeout(r,0));
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h}

/* ---------- state ---------- */
function blank(){
 const per=[['p1','08:00','09:00','m',false],['p2','09:00','10:00','m',true],['p3','10:15','11:15','m',false],['p4','11:15','12:15','m',false],['p5','13:30','14:30','e',false],['p6','14:30','15:30','e',false],['p7','15:30','16:30','e',false]].map(([id,start,end,session,breakAfter])=>({id,start,end,session,breakAfter}));
 const dp={};[0,1,2,3,4].forEach(d=>dp[d]=['p1','p2','p3','p4'].concat(d<=2?['p5','p6','p7']:[]));
 return {inst:{name:'',city:'',dir:'',head:'',year:'2026/2027',days:[0,1,2,3,4],periods:per,dayPeriods:dp},
  years:[{id:'y1',name:'2026/2027'}],activeYear:'y1',levels:[],streams:[],subjects:[],programs:[],classes:[],teachers:[],rooms:[],
  roomTypes:['عادية','مخبر فيزياء','مخبر علوم','إعلام آلي','رياضة'],rules:[],
  prefs:{coreSpread:6,heavy:5,gapC:8,gapT:5,longRun:5,hours:5,awk:5,balance:5},tue:{on:true,day:2,ses:'e'},capacity:false,timetable:null};
}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function load(){try{const j=localStorage.getItem(LS);if(j)return Object.assign(blank(),JSON.parse(j))}catch(e){}return blank()}
const P=()=>S.inst.periods;
const pIdx=id=>P().findIndex(p=>p.id===id);
const enabled=(d,pid)=>S.inst.days.includes(d)&&(S.inst.dayPeriods[d]||[]).includes(pid)&&pIdx(pid)>=0;
const link=i=>i>=0&&i+1<P().length&&P()[i].session===P()[i+1].session&&!P()[i].breakAfter;
const sortedDays=()=>S.inst.days.slice().sort((a,b)=>a-b);
function activeClasses(){return S.classes.filter(c=>{const st=by(S.streams,c.streamId),lv=st&&by(S.levels,st.levelId);return lv&&lv.yearId===S.activeYear})}
const progsOf=c=>S.programs.filter(p=>p.streamId===c.streamId&&p.hours>0&&by(S.subjects,p.subjectId));
const progOf=(c,sid)=>S.programs.find(p=>p.streamId===c.streamId&&p.subjectId===sid);
const needRT=pr=>pr&&pr.roomType&&pr.roomType!=='عادية'?pr.roomType:'';
const teacherFor=(cid,sid)=>S.teachers.find(t=>t.subjectId===sid&&t.classIds.includes(cid));
function totalSlots(){let n=0;S.inst.days.forEach(d=>n+=(S.inst.dayPeriods[d]||[]).filter(p=>pIdx(p)>=0).length);return n}
function teacherLoad(t){return t.classIds.reduce((a,cid)=>{const c=by(S.classes,cid);const pr=c&&progOf(c,t.subjectId);return a+(pr?pr.hours:0)},0)}
function partition(pr){const h=pr.hours|0;if(pr.splittable===false)return[h];const bs=Math.max(1,Math.min(h,(pr.blockSize|0)||1)),a=[];let r=h;while(r>0){const x=Math.min(bs,r);a.push(x);r-=x}return a}
function cfgSig(){return hash(JSON.stringify([S.inst,S.levels,S.streams,S.programs,S.classes,S.teachers,S.rooms,S.rules,S.subjects,S.activeYear,S.capacity]))}
function autoAssign(cap=18){let made=0;S.subjects.forEach(sub=>{const need=[];activeClasses().forEach(c=>{const pr=progOf(c,sub.id);if(pr&&pr.hours>0&&!teacherFor(c.id,sub.id))need.push({c,h:pr.hours})});need.sort((a,b)=>b.h-a.h);const ts=S.teachers.filter(t=>t.subjectId===sub.id);need.forEach(n=>{let t=ts.find(t=>teacherLoad(t)+n.h<=cap);if(!t){t={id:uid('t'),name:'أستاذ '+sub.name+' '+(ts.length+1),subjectId:sub.id,classIds:[],unavail:[],pref:[],maxConsec:3};S.teachers.push(t);ts.push(t);made++}t.classIds.push(n.c.id)})});return made}

function loadDemo(){
 const D=blank();S=D;const y='y1';D.inst.name='ثانوية الأمل (بيانات تجريبية)';
 D.levels=[{id:'lv3',name:'3 ثانوي',yearId:y}];
 const st={};[['m','رياضيات'],['s','علوم'],['a','آداب'],['l','لغات']].forEach(([k,n])=>{st[k]={id:'st'+k,levelId:'lv3',name:n,maxDay:0,minDay:0};D.streams.push(st[k])});
 [['mat','رياضيات','علمية'],['phy','فيزياء','علمية'],['nat','علوم طبيعية','علمية'],['tpp','أعمال تطبيقية (فيزياء)','علمية'],['tpn','أعمال تطبيقية (علوم)','علمية'],['ara','لغة عربية','أدبية'],['fra','لغة فرنسية','لغات'],['eng','لغة إنجليزية','لغات'],['esp','لغة إسبانية','لغات'],['phi','فلسفة','أدبية'],['his','تاريخ وجغرافيا','أدبية'],['isl','علوم إسلامية','شرعية'],['inf','إعلام آلي','تقنية'],['pe','تربية بدنية','رياضة']].forEach(([k,n,t])=>D.subjects.push({id:'sb_'+k,name:n,type:t}));
 const pg=(k,s,h,fl='',rt='عادية',sp=true)=>D.programs.push({id:uid('p'),streamId:st[k].id,subjectId:'sb_'+s,hours:h,coef:fl.includes('c')?4:1,core:fl.includes('c'),heavy:fl.includes('h'),roomType:rt,splittable:sp,blockSize:1,minDay:0,maxDay:2});
 pg('m','mat',5,'ch');pg('m','phy',3,'ch');pg('m','tpp',2,'h','مخبر فيزياء',false);pg('m','nat',2);pg('m','ara',2);pg('m','fra',2);pg('m','eng',2);pg('m','phi',2);pg('m','inf',1,'','إعلام آلي');pg('m','pe',1,'','رياضة');
 pg('s','nat',4,'ch');pg('s','tpn',2,'h','مخبر علوم',false);pg('s','phy',3,'c');pg('s','mat',4,'ch');pg('s','ara',3);pg('s','fra',2);pg('s','eng',2);pg('s','phi',2);pg('s','inf',1,'','إعلام آلي');pg('s','pe',1,'','رياضة');
 pg('a','phi',5,'c');pg('a','ara',5,'c');pg('a','his',4);pg('a','fra',3);pg('a','eng',2);pg('a','mat',2);pg('a','isl',2);pg('a','pe',1,'','رياضة');
 pg('l','eng',4,'c');pg('l','fra',4,'c');pg('l','esp',3,'c');pg('l','ara',3);pg('l','phi',2);pg('l','his',3);pg('l','mat',2);pg('l','pe',1,'','رياضة');
 [['m1','3 رياضيات 1','m'],['m2','3 رياضيات 2','m'],['s1','3 علوم 1','s'],['s2','3 علوم 2','s'],['a1','3 آداب 1','a'],['l1','3 لغات 1','l']].forEach(([k,n,s],i)=>{D.rooms.push({id:'rg'+k,name:'القاعة '+(11+i),type:'عادية',capacity:35,subjectIds:[]});D.classes.push({id:'c'+k,streamId:st[s].id,name:n,size:30,roomId:'rg'+k})});
 [['rp','مخبر الفيزياء','مخبر فيزياء',24],['rn','مخبر العلوم','مخبر علوم',24],['ri','قاعة الإعلام الآلي','إعلام آلي',30],['rs','قاعة الرياضة','رياضة',60]].forEach(([id,n,t,c])=>D.rooms.push({id,name:n,type:t,capacity:c,subjectIds:[]}));
 autoAssign(18);
 const N=['أحمد','سمير','ليلى','كريم','نادية','يوسف','أمينة','رشيد','سعاد','عمر','فاطمة','إلياس','حنان','مراد','سلمى','وليد','هدى','بلال','ريما','طارق','منى','ياسين','نوال','حمزة','سارة'];
 D.teachers.forEach((t,i)=>t.name='أ. '+N[i%N.length]);if(D.teachers[0])D.teachers[0].unavail=['1-p1'];
 save();
}

/* ---------- compile & solver ---------- */
function compile(){
 const per=P(),NP=per.length,ND=7,en=new Uint8Array(ND*NP);
 S.inst.days.forEach(d=>(S.inst.dayPeriods[d]||[]).forEach(pid=>{const i=pIdx(pid);if(i>=0)en[d*NP+i]=1}));
 const lk=per.map((_,i)=>link(i)?1:0),ses=per.map(p=>p.session==='e'?1:0);
 let lastE=-1;ses.forEach((s,i)=>{if(s===1)lastE=i});
 const classes=activeClasses(),cI={};classes.forEach((c,i)=>cI[c.id]=i);
 const teachers=S.teachers,tI={};teachers.forEach((t,i)=>tI[t.id]=i);
 const rooms=S.rooms,rI={};rooms.forEach((r,i)=>rI[r.id]=i);
 const sI={};S.subjects.forEach((s,i)=>sI[s.id]=i);
 const actDays=sortedDays(),NT=teachers.length;
 const tUn=new Uint8Array(NT*ND*NP),tPref=new Uint8Array(NT*ND*NP),tHas=[],tMax=[],tLoad=[],tCap=[];
 teachers.forEach((t,ti)=>{(t.unavail||[]).forEach(k=>{const[d,pid]=k.split('-'),pi=pIdx(pid);if(pi>=0)tUn[(ti*ND+(+d))*NP+pi]=1});const pf=t.pref||[];tHas.push(pf.length>0);pf.forEach(k=>{const[d,pid]=k.split('-'),pi=pIdx(pid);if(pi>=0)tPref[(ti*ND+(+d))*NP+pi]=1});tMax.push(t.maxConsec||0);tLoad.push(0);let c=0;actDays.forEach(d=>{for(let p=0;p<NP;p++)if(en[d*NP+p]&&!tUn[(ti*ND+d)*NP+p])c++});tCap.push(c)});
 const dayCap=new Array(ND).fill(0);actDays.forEach(d=>{for(let p=0;p<NP;p++)if(en[d*NP+p])dayCap[d]++});const capSum=dayCap.reduce((a,b)=>a+b,0)||1;
 const blocks=[],classSubs=classes.map(()=>[]),classTot=classes.map(()=>0),cMax=classes.map(c=>(by(S.streams,c.streamId)||{}).maxDay||0);
 const nd=actDays.length||1;
 classes.forEach((c,ci)=>progsOf(c).forEach(pr=>{
  const t=teacherFor(c.id,pr.subjectId),ti=t?tI[t.id]:-1,si=sI[pr.subjectId];if(si===undefined)return;
